name: Refresh contribution arcade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/arcade.yml', '.github/activity.mjs']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency: profile-arcade

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Render profile stats
        run: node .github/activity.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Update README statistics
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m "Refresh profile statistics"
            git push origin HEAD:main
          fi

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Render the contribution calendar in both themes
        uses: abozanona/pacman-contribution-graph@70945878b1118303b37b88060fc7145e1a57d7b1
        with:
          github_user_name: ${{ github.repository_owner }}
          games: snake,pacman

      - name: Check generated images
        run: |
          for game in snake pacman; do
            for theme in '' '-dark'; do
              test -s "dist/${game}-contribution-graph${theme}.svg"
            done
          done

      - name: Publish arcade images
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: profile-arcade
